name: Deploy telegram-bot function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/telegram-bot/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --no-verify-jwt: تليجرام مش بيبعت توكن Supabase؛ الحماية بكلمة السر جوه الدالة
        run: supabase functions deploy telegram-bot --project-ref zanjzbgnmwruvoliikhi --no-verify-jwt --use-api
