name: Deploy Create-user function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/create-user/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # اسم الدالة المنشورة Create-user بحرف كبير
          cp -r supabase/functions/create-user supabase/functions/Create-user
          supabase functions deploy Create-user --project-ref zanjzbgnmwruvoliikhi --use-api
